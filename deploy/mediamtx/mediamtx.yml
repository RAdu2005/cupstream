# MediaMTX configuration for CupStream. Settings not listed keep MediaMTX's
# defaults. Values can be overridden with MTX_* environment variables, e.g.
# MTX_WEBRTCADDITIONALHOSTS=203.0.113.10 for the server's public IP.
#
# Only the CupStream server talks to MediaMTX over HTTP, on localhost: it is
# the single place that decides who may publish and watch. Media packets
# travel directly between clients and port 8189 (UDP, TCP fallback).

logLevel: info

# The UDP sockets that viewers share get a larger send buffer, so that key
# frames going out to many viewers at once do not block them. Linux caps it
# at net.core.wmem_max, which has to be raised on the host (see
# docs/mediamtx.md).
udpWriteBufferSize: 8388608

# WHIP and WHEP requests reach the WebRTC listener, which listens on
# 127.0.0.1 only, through the CupStream server; it passes the client's
# address in X-Forwarded-For, which MediaMTX then treats as the request's
# IP, so that rule cannot be IP-based. The API must come from this machine.
authMethod: internal
authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: publish
      - action: read
  - user: any
    ips: ['127.0.0.1/32', '::1/128']
    permissions:
      - action: api

api: true
apiAddress: 127.0.0.1:9997

webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: []
webrtcLocalUDPAddress: :8189
# Sockets sharing port 8189 (from v1.21.2-cupstream.4; Linux only), so that
# sessions send in parallel: on a single socket every packet waits for the
# previous one, which capped the output at about 970 Mbit/s in the load test
# (server/loadtest). Older builds refuse this setting.
webrtcLocalUDPSockets: 8
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []
webrtcICEServers2: []
webrtcTrustedProxies: ['127.0.0.1/32', '::1/128']
# How often WebRTC publishers are asked for a key frame. Joining, resuming
# and lost frames ask straight away; this is a fallback.
webrtcKeyFrameRequestPeriod: 2s
# Only the CupStream server pauses and resumes viewers, through the API: a
# viewer holding a session URL must not resume a session the server paused.
webrtcAllowPausePatch: false
# A backstop for paused sessions the CupStream server forgot. The server
# itself disconnects held viewers after 2 minutes; viewers' own pauses
# (background tiles, pre-warmed streams) may last longer.
webrtcPausedTimeout: 30m

# Viewers and senders use WebRTC only. RTSP is for FFmpeg on this machine,
# which reads streams and publishes their transcodes (see paths below).
rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:8554
rtmp: false
hls: false
srt: false
moq: false
playback: false
metrics: false
pprof: false

paths:
  # Low-quality versions the CupStream server transcodes on demand
  # (docs/low-quality.md): while someone reads s/<streamId>/transcode, FFmpeg
  # reads the stream and publishes a copy of at most 720p30, H.264 without
  # B-frames at 1.2 Mbit/s, with the stream's Opus audio. MediaMTX stops it
  # 10 seconds after its last reader left, and kills it if it ignores that
  # for 10 seconds more. The server caps how many run (CUPSTREAM_TRANSCODES),
  # and asks for none while that is 0, so this does nothing without FFmpeg.
  # Each transcode is limited to 2 threads for decoding and 2 for encoding.
  "~^s/([a-z2-7]{16})/transcode$":
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel warning -nostdin
      -fflags nobuffer -analyzeduration 500000 -threads 2
      -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/s/$G1
      -map 0:v:0 -map 0:a:0?
      -vf "scale=-2:'min(720,ih)',fps=30"
      -c:v libx264 -preset veryfast -tune zerolatency -profile:v baseline -bf 0 -g 30
      -b:v 1200k -maxrate 1200k -bufsize 1200k -pix_fmt yuv420p -threads 2
      -c:a copy
      -f rtsp -rtsp_transport tcp -pkt_size 1200 rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: true
    # Within the CupStream server's 10-second timeout for MediaMTX.
    runOnDemandStartTimeout: 8s
    runOnDemandCloseAfter: 10s
    overridePublisher: false
    maxReaders: 150
  # Stream paths (s/<streamId>, and s/<streamId>/low for a low-quality
  # version from the sender) are created by publishing to them.
  all_others:
    # A second publisher is refused instead of replacing the first; the
    # CupStream server closes the old one itself when a sender reconnects.
    overridePublisher: false
    # A safety cap: 1 Gbps carries about 125 viewers at 8 Mbps. Per-stream
    # limits are applied by the CupStream server.
    maxReaders: 150
