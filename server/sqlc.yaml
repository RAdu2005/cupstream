version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
        emit_empty_slices: true
        overrides:
          - { column: room_allowed.can_stream, go_type: bool }
          - { column: room_passes.can_stream, go_type: bool }
          - { column: invites.can_stream, go_type: bool }
          - { column: invites.until_stream_end, go_type: bool }
          - { column: user_guilds.suggestions_enabled, go_type: bool }
          - { column: discord_guilds.announce, go_type: bool }
overrides:
  go:
    rename:
      avatar_url: AvatarURL
