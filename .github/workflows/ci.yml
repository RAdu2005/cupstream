name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Vet and test
        run: make test-server
      - name: Generated code is up to date
        run: make check-generated

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
        working-directory: web
      - name: Typecheck and test
        run: make test-web
      - run: npm run build
        working-directory: web

  # Builds both images (MediaMTX from the pinned fork tag) and checks that the
  # stack starts and the development login works end to end.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: |
          cat > .env <<'EOF'
          CUPSTREAM_PUBLIC_URL=http://localhost:8080
          CUPSTREAM_DEV_LOGIN=true
          EOF
          docker compose up -d
      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 30); do
            curl -sf http://localhost:8080/healthz | grep -q '"reachable":true' && break
            sleep 1
          done
          curl -sf http://localhost:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"handle":"ci"}' http://localhost:8080/api/auth/dev/login
          curl -sf -b cookies.txt http://localhost:8080/api/me | grep -q '"handle":"ci"'
          # MediaMTX's HTTP listeners (API, WHIP/WHEP) must be bound to localhost only.
          for port in 9997 8889; do
            listeners=$(ss -Hltn "sport = :$port" | awk '{print $4}')
            echo "port $port: $listeners"
            if [ -z "$listeners" ] || echo "$listeners" | grep -qv '^127\.0\.0\.1:'; then
              echo "MediaMTX port $port must listen on 127.0.0.1 only"; exit 1
            fi
          done
      - name: Logs
        if: always()
        run: docker compose logs

  # Every push to master goes to production once the checks pass. The
  # production environment (master only) holds an SSH key that can run
  # nothing but deploy/cupstream/cupstream-deploy on the server. To roll back,
  # revert the change, or re-run this job in the run of an earlier commit.
  # These logs are public: never print the host or server logs here.
  deploy:
    needs: [server, web, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cupstream.larp.love
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make build VERSION=$GITHUB_SHA
      - name: Install on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            deploy@"$DEPLOY_HOST" "$GITHUB_SHA" < bin/cupstream
      - name: The public site runs this commit
        run: |
          for i in $(seq 30); do
            v=$(curl -sf https://cupstream.larp.love/healthz | jq -r .version) || true
            [ "$v" = "$GITHUB_SHA" ] && exit 0
            sleep 2
          done
          echo "https://cupstream.larp.love reports version '${v:-}', expected $GITHUB_SHA"
          exit 1

  release:
    needs: [server, web, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: make build
      - run: mv bin/cupstream bin/cupstream-linux-amd64
      - uses: softprops/action-gh-release@v3
        with:
          files: bin/cupstream-linux-amd64
          generate_release_notes: true
