[package]
name = "cupstream-app"
description = "CupStream desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "cupstream_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
cupstream-client = { path = "../../client" }
cupstream-media = { path = "../../media" }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "async-secret-service", "tokio", "crypto-rust"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
