[package]
name = "cupstream-media"
description = "CupStream's media pipeline: screen capture, encoding, audio without Discord and WHIP publishing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
gst.workspace = true
gst-video.workspace = true
gst-webrtc.workspace = true
gst-plugin-webrtc.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
